name: 每日早安推送

on:
  schedule:
    # 避开
    - cron: '37 22 * * *'
  workflow_dispatch:  # 允许手动点击测试

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-qq.txt
      
      - name: 安装依赖
        run: |
          python -m pip install -r requirements-qq.txt

      - name: 验证核心逻辑
        run: python -m unittest discover -s tests -v

      - name: 恢复近期文案指纹
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .state/ai-greetings.json
          key: ai-greetings-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-greetings-${{ github.ref_name }}-
      
      - name: 发送 QQ 早安
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_USER_OPENID: ${{ secrets.QQ_USER_OPENID }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED || 'true' }}
        run: python -u qq_push.py --mode test

      - name: 保存已发送文案指纹
        if: success() && hashFiles('.state/ai-greetings.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .state/ai-greetings.json
          key: ai-greetings-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
